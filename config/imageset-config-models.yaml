# ModelCar weights, mirrored as their own oc-mirror batch.
#
# WHY NOT JUST APPEND TO CRIAB's additional-images.txt
#
# That is the documented Route A and it is correct on a cluster CRIAB built
# alone. It is the wrong move on a cluster that has had more than one mirror
# batch applied to it — which is the normal end state, because MaaS, RHOAI and
# anything else each ran their own.
#
# Re-running CRIAB's phase 10 regenerates the FULL RHOAI ImageSetConfiguration,
# and its phase 20 regenerates cluster-resources including IDMS objects named
# idms-operator-0 / idms-generic-0. Applying those does not merge — it replaces
# the objects of the same name. If the regenerated set is narrower than what is
# on the cluster (different config, different RHOAI version, anything), mirror
# rules other workloads depend on silently disappear, and the failure shows up
# later as ImagePullBackOff on something unrelated.
#
# It also re-walks a ~300 GB catalog to add 8.5 GB of model weights.
#
# A separate batch with its own namespace generates its own distinctly-named
# IDMS, so applying it ADDS rules and touches nothing existing.
#
#   LOW SIDE
#     oc-mirror --v2 --config config/imageset-config-models.yaml \
#       file:///mnt/mirror/llmd-mirror
#     rsync -avP --append /mnt/mirror/llmd-mirror/ lab-user@<HIGH>:/mnt/mirror/llmd-mirror/
#
#   HIGH SIDE
#     # --config is mandatory in BOTH directions, and --from needs the file://
#     # scheme. Omitting either gets you the full usage dump and
#     #   [Executor] use the --config flag it is mandatory
#     oc-mirror --v2 --config config/imageset-config-models.yaml \
#       --from file:///mnt/mirror/llmd-mirror \
#       docker://<MIRROR_REGISTRY>/llmd
#     oc apply -f /mnt/mirror/llmd-mirror/working-dir/cluster-resources/idms-oc-mirror.yaml
#
# The IDMS apply triggers a MachineConfig rollout and the nodes reboot. Check
# what the generated file contains before applying it — `oc diff -f` against the
# cluster is the cheap way to be sure it only adds.
apiVersion: mirror.openshift.io/v2alpha1
kind: ImageSetConfiguration
mirror:
  additionalImages:
    # Qwen2.5-0.5B-Instruct — the smoke-test model, ~0.9 GiB.
    - name: quay.io/redhat-ai-services/modelcar-catalog@sha256:e20441c23be795838409137576b9016e6bc941eec79e5765cf9de6319c0ec769

    # Qwen3-4B — the demo model, ~7.6 GiB.
    - name: quay.io/redhat-ai-services/modelcar-catalog@sha256:2252a63e6f0f36df27ace6497330dfba61b7501024cf44fa67480d3848471809

    # httpd base for the disconnected GPU kernel/CUDA repo. Only needed if the
    # NVIDIA driver cannot reach developer.download.nvidia.com, but mirroring it
    # now costs little and saves a second low->high round trip later.
    - name: registry.access.redhat.com/ubi9/httpd-24:latest

    # --- llm-d runtime components -------------------------------------------
    #
    # These are declared by the LLMInferenceServiceConfig presets the RHOAI
    # operator ships, and they are NOT necessarily in the RHOAI mirror: a
    # cluster can run RHOAI happily for weeks without them, because nothing
    # pulls them until the first LLMInferenceService is created. On the CRIAB
    # cluster all four were missing while RHOAI itself reported Ready.
    #
    # Discover the right digests for YOUR cluster rather than trusting these —
    # they are version-specific and change every RHOAI z-stream:
    #
    #   scripts/20-verify-mirror.sh          # names the missing ones exactly
    #   oc get llminferenceserviceconfig -A -o json | jq -r '[..|.image? //empty]|unique[]'
    #
    # Only the accelerator runtime you actually have is needed. The ROCm, Gaudi
    # and Spyre variants are declared too and are dead weight on an NVIDIA node.
    - name: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:5800e12b2a465f15961fcf34b645d79ed4f91ec9161eab22b1205d12682183c8
    - name: registry.redhat.io/rhoai/odh-kserve-storage-initializer-rhel9@sha256:83bebb2ea3ef6285355a45c56af393d3cec4cb9802717c436515f283bf806845
    - name: registry.redhat.io/rhoai/odh-llm-d-inference-scheduler-rhel9@sha256:3b630017598a70a380d5ce9f5e15916a1b9cc8f16f392e544182399731d2bda6
    - name: registry.redhat.io/rhoai/odh-llm-d-kv-cache-rhel9@sha256:8f684d8820aacde27c5baf5937d4068badfba4cc95155c98a684b8d8697d3368
    - name: registry.redhat.io/rhoai/odh-llm-d-routing-sidecar-rhel9@sha256:18dbf82a01a3ea9eba27519884c9427a73a9d3a572d8c7c673aa821806034bb8
