# GPU MachineSet — NVIDIA L40S on AWS (g6e family).
#
# This is a TEMPLATE. Every ${VAR} is discovered from the cluster's existing
# worker MachineSet by scripts/12-gpu-machineset.sh, which renders and applies
# it. Rendering by hand:
#
#   export INFRA_ID=$(oc get infrastructure cluster -o jsonpath='{.status.infrastructureName}')
#   ...
#   envsubst < manifests/gpu/machineset-l40s.yaml | oc apply -f -
#
# Values are cloned from the existing worker set rather than written down,
# because the AMI, subnet and security group are all cluster-build-specific. A
# hard-coded AMI is the single most common reason a copied MachineSet provisions
# an instance that never joins the cluster.
#
# L40S instance types (48 GB VRAM per GPU, Ada Lovelace):
#
#   g6e.xlarge     1x L40S    4 vCPU   32 GiB
#   g6e.2xlarge    1x L40S    8 vCPU   64 GiB   <- default
#   g6e.4xlarge    1x L40S   16 vCPU  128 GiB
#   g6e.12xlarge   4x L40S   48 vCPU  384 GiB   <- for 4 llm-d replicas
#   g6e.48xlarge   8x L40S  192 vCPU 1536 GiB
#
# 48 GB is roomy for the models here — Qwen3-4B at bf16 is about 8 GB — so the
# headroom goes to KV cache, which is what actually limits concurrency.
#
# g6e is not offered in every availability zone. The script checks the AZ with
# `aws ec2 describe-instance-type-offerings` before applying, because the
# failure mode otherwise is a Machine stuck in Provisioning with the reason
# buried in the machine-controller log.
apiVersion: machine.openshift.io/v1beta1
kind: MachineSet
metadata:
  name: ${MS_NAME}
  namespace: openshift-machine-api
  labels:
    machine.openshift.io/cluster-api-cluster: ${INFRA_ID}
spec:
  replicas: ${GPU_REPLICAS}
  selector:
    matchLabels:
      machine.openshift.io/cluster-api-cluster: ${INFRA_ID}
      machine.openshift.io/cluster-api-machineset: ${MS_NAME}
  template:
    metadata:
      labels:
        machine.openshift.io/cluster-api-cluster: ${INFRA_ID}
        machine.openshift.io/cluster-api-machine-role: gpu
        machine.openshift.io/cluster-api-machine-type: gpu
        machine.openshift.io/cluster-api-machineset: ${MS_NAME}
    spec:
      metadata:
        labels:
          node-role.kubernetes.io/gpu: ""
      # Optional nvidia.com/gpu:NoSchedule taint, injected by
      # scripts/12-gpu-machineset.sh when GPU_TAINT=true. Empty otherwise, and
      # empty is the default — a taint keeps cheap workloads off an expensive
      # node, but it also means every DaemonSet that must run there (NFD worker,
      # the NVIDIA driver, the device plugin) has to tolerate it. When one of
      # them does not, the symptom is a GPU node with no nvidia.com/gpu
      # capacity, which reads exactly like a hardware or driver failure.
      # Turn it on after the GPU stack is confirmed working, not before.
${GPU_TAINTS_BLOCK}
      providerSpec:
        value:
          apiVersion: machine.openshift.io/v1beta1
          kind: AWSMachineProviderConfig
          ami:
            id: ${AMI}
          instanceType: ${INSTANCE_TYPE}
          placement:
            availabilityZone: ${AZ}
            region: ${REGION}
          subnet:
            id: ${SUBNET}
          iamInstanceProfile:
            id: ${IAM_PROFILE}
          securityGroups:
            - filters:
                - name: tag:Name
                  values:
                    - ${SG}
          tags:
            - name: kubernetes.io/cluster/${INFRA_ID}
              value: owned
          userDataSecret:
            name: worker-user-data
          credentialsSecret:
            name: aws-cloud-credentials
          blockDevices:
            - ebs:
                # Red Hat's llm-d prerequisites call for 50 GB per GPU node for
                # images and ephemeral storage. That is a floor, not a target:
                # the vLLM CUDA image, the ModelCar weights, the NVIDIA driver
                # build and the container filesystem all land here. 200 GB
                # leaves room to add a second model without a resize.
                volumeSize: ${GPU_VOLUME_SIZE}
                volumeType: gp3
                encrypted: true
          metadataServiceOptions: {}
