# Dashboard-facing description of the GPU shape. The LLMInferenceService
# annotations reference it by name and namespace; without it the model still
# serves, but the RHOAI dashboard shows no hardware for the deployment.
apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: gpu-profile
  namespace: redhat-ods-applications
  annotations:
    opendatahub.io/dashboard-feature-visibility: '[]'
    opendatahub.io/disabled: 'false'
    opendatahub.io/display-name: gpu-profile
spec:
  identifiers:
    - identifier: cpu
      displayName: CPU
      resourceType: CPU
      minCount: 1
      maxCount: '8'
      defaultCount: '1'
    - identifier: memory
      displayName: Memory
      resourceType: Memory
      minCount: 1Gi
      maxCount: 32Gi
      defaultCount: 12Gi
    - identifier: nvidia.com/gpu
      displayName: GPU
      resourceType: Accelerator
      minCount: 1
      # g5.12xlarge carries 4x A10G. Lower this to 1 for a g5.2xlarge node.
      maxCount: 4
      defaultCount: 1
